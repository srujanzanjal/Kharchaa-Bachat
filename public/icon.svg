<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#242320" />
      <stop offset="100%" stop-color="#131211" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db733b" />
      <stop offset="100%" stop-color="#b0521e" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a2825" stroke-width="4"/>

  <!-- Inner Badge Frame -->
  <rect x="72" y="72" width="368" height="368" rx="72" fill="#1c1b19" stroke="#2a2825" stroke-width="2" filter="url(#subtleShadow)"/>

  <!-- Stylized Rupee Emblem + Bachat Spark -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Top Horizontal Bar 1 -->
    <rect x="-70" y="-86" width="140" height="18" rx="9" fill="url(#accentGrad)"/>
    <!-- Horizontal Bar 2 -->
    <rect x="-70" y="-52" width="120" height="18" rx="9" fill="url(#accentGrad)"/>
    
    <!-- Central Stem & Loop -->
    <path d="M -36,-86 L -36,0 C -6,0 20,-6 20,-34 C 20,-62 -4,-68 -36,-68" 
          fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Downward Diagonal Leg -->
    <path d="M -22,-6 L 36,80" 
          fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Subtle Growth Spark (Bachat) -->
    <circle cx="58" cy="-56" r="10" fill="#f2efe8"/>
    <path d="M 58,-76 L 58,-36 M 38,-56 L 78,-56" stroke="#c8622a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
